name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      - name: Restore (locked)
        run: dotnet restore SoundRevival.slnx --locked-mode

      - name: Build
        run: dotnet build SoundRevival.slnx -c Release --no-restore

      - name: Check formatting
        run: dotnet format SoundRevival.slnx --verify-no-changes --no-restore

      - name: Restore tools
        run: dotnet tool restore

      - name: Test
        run: dotnet test SoundRevival.slnx -c Release --no-build --coverage --coverage-output-format cobertura --coverage-settings coverage.config

      - name: Coverage summary
        run: |
          dotnet reportgenerator -reports:"TestResults/*.cobertura.xml" -targetdir:coverage-report -reporttypes:MarkdownSummaryGithub
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

