name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: Restore (locked)
        run: dotnet restore SoundRevival.slnx --locked-mode

      - name: Build
        run: dotnet build SoundRevival.slnx -c Release --no-restore

      - name: Check formatting
        run: dotnet format SoundRevival.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test SoundRevival.slnx -c Release --no-build
